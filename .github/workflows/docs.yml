# Publica el sitio de la suite en GitHub Pages en cada push a master.
#
# Para activarlo, UNA VEZ, en el repositorio:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# No hace falta crear ni mantener una rama gh-pages: este workflow sube el
# artefacto directamente.
name: docs

on:
  push:
    branches: [master]
    paths: ['atsw-suite/docs/**', 'atsw-suite/mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mkdocs-material
      - run: mkdocs build -f atsw-suite/mkdocs.yml -d _site
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
