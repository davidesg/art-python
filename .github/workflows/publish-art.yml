name: Publish art-tseries

# Publishes the art-tseries package (repo root) to PyPI via trusted publishing
# on an `art-v*` tag.  atsw (the umbrella meta-package in atsw-suite/) has its own
# workflow + `atsw-v*` tag so the two packages release independently from this
# monorepo.

on:
  push:
    tags: ["art-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # BUG-0125. El material que los recursos MCP sirven en ejecucion
      # -- el registro de defectos y la documentacion -- vive en bugs/ y docs/,
      # que el empaquetado NO distribuye (`prune bugs` en MANIFEST.in, y
      # pyproject empaqueta solo src/). Sin este paso la rueda sale con 27
      # ficheros y `art://defectos` contesta que no hay nada: la 0.2.0 se
      # publico asi. La copia va dentro del paquete y se genera aqui.
      - name: Sync the material the MCP resources serve
        run: |
          python3 tools/sync_material.py
          test -d src/art/material/bugs
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: The wheel must carry the material (BUG-0125)
        run: |
          python3 - <<'PY'
          import glob, zipfile, sys
          n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          bugs = sum(1 for x in n if 'material/bugs/' in x)
          docs = sum(1 for x in n if 'material/docs/' in x)
          print(f'wheel: {len(n)} files, {bugs} reports, {docs} docs')
          sys.exit(0 if bugs > 100 and docs else 'the wheel does not carry the material')
          PY
      # INSTALL AND IMPORT WHAT IS ABOUT TO BE PUBLISHED.
      #
      # This step did not exist, on the reasoning that "art-tseries depends on
      # fue, which may not be on PyPI yet when this release runs (suite
      # chicken-and-egg)". That was true once and is not any more — fue is
      # published — and its absence is exactly how 0.1.3 shipped broken: it
      # declared an unbounded `mcp>=1.0`, mcp 2.0.0 removed
      # `mcp.server.fastmcp`, and `art-mcp` cannot import at all in a clean
      # environment. `python -m build` cannot catch that, because the packaging
      # was fine; the RESOLUTION was not.
      #
      # If a future release does hit the chicken-and-egg, this step fails and
      # the release stops. That is the correct outcome: better a blocked
      # release than a published package nobody can install.
      - name: Smoke-test the built wheel
        run: |
          WHL=$(ls dist/art_tseries-*-py3-none-any.whl)
          python -m pip install "$WHL"
          python -c "import art; print('art-tseries', art.__version__ if hasattr(art,'__version__') else '(sin __version__)')"
          python -c "import asyncio; from art.mcp_server import mcp; \
                     n=len(asyncio.run(mcp.list_tools())); print('art tools:', n); \
                     assert n >= 30, n"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/art-v')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
