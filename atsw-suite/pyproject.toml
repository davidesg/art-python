[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "atsw"
version         = "1.2.0"
description     = "ATSW — A Time Series Workshop: the Box-Jenkins-Treadway suite (univariate exact-ML estimation, graphics, model building, transfer functions and multivariate VARMA) with three MCP assistants for LLM-driven analysis"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "ARIMA", "VARMA", "multivariate", "Box-Jenkins", "Treadway", "MCP", "suite"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]

# Umbrella meta-package: no code of its own, just a compatible set of the suite
# components. `pip install atsw` installs the whole suite + the MCP server.
# Three MCP assistants, one ladder. They are SEPARATE servers on purpose: an MCP
# client sees every connected server at once, so routing is not a missing
# capability, and merging them would merge three instruction blocks that
# contradict each other at the opening question. This package installs them; it
# deliberately does not speak. See drtran-python/docs/ARCHITECTURE_MCP.md §4b.
#
#     art     one series: ARIMA + interventions        engine: fue      -> art-mcp
#     mtram   transfer functions and networks (a DAG)  engine: drtran   -> mtram
#     sima    simultaneous VARMA                       engine: drvarma  -> sima
dependencies = [
    "fue>=0.1.8",             # univariate estimation engine + FUF forecasting
    "pyfug>=2.0",             # Jenkins-Treadway graphics
    "art-tseries>=0.1.3",     # model building + MCP server (art-mcp)
    "drtran[mcp]>=0.1.0",   # transfer functions and networks + MCP server (mtram)
    "drvarma[mcp]>=0.1.2",    # multivariate VARMA + MCP server (sima)
]

# One console script, and deliberately nothing else. The umbrella INSTALLS; it
# does not speak. `atsw-mcp` registers the three assistants with Claude Code in
# one step — MCP has no mechanism for one server to register another, so this is
# a setup command, not a fourth server.
[project.scripts]
atsw-mcp = "atsw.mcp_install:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["atsw"]
