[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "atsw"
version         = "2.1.0"
description     = "ATSW — A Time Series Workshop: the Box-Jenkins-Treadway suite (univariate exact-ML estimation, graphics, model building, transfer functions, multivariate VARMA and cointegrated VEC) with three MCP assistants for LLM-driven analysis"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "ARIMA", "VARMA", "VEC", "cointegration", "multivariate", "Box-Jenkins", "Treadway", "MCP", "suite"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]

# Umbrella meta-package: no code of its own, just a compatible set of the suite
# components. `pip install atsw` installs the whole suite + the MCP server.
# Three MCP assistants, one ladder. They are SEPARATE servers on purpose: an MCP
# client sees every connected server at once, so routing is not a missing
# capability, and merging them would merge three instruction blocks that
# contradict each other at the opening question. This package installs them; it
# deliberately does not speak. See drtran-python/docs/ARCHITECTURE_MCP.md §4b.
#
#     art     one series: ARIMA + interventions        engine: fue      -> art-mcp
#     mtram   transfer functions and networks (a DAG)  engine: drtran   -> mtram
#     sima    simultaneous VARMA, and the VEC when     engine: drvarma  -> sima
#             the series are cointegrated                      + drvec
#             (since atsw 2.0.0 its own package, sima-tseries; drvarma is the engine;
#             since atsw 2.1.0 drvec, the port of the drvec C program, the VEC's)
# NONE of these lower bounds is cosmetic. Every one of them is the first version
# of its package that actually works in a clean environment:
#
#   fue >= 0.1.9, drvarma >= 0.1.3  every earlier binary wheel installed fine and
#                                   then failed to load its C engine (cffi was
#                                   missing from their runtime dependencies), so
#                                   the suite silently ran on the pure-Python
#                                   fallbacks;
#   art-tseries >= 0.1.4            0.1.3 CANNOT BE IMPORTED at all in a clean
#                                   environment: it declares an unbounded
#                                   `mcp>=1.0`, and mcp 2.0.0 removed
#                                   `mcp.server.fastmcp`, which art/mcp_server.py
#                                   imports. mcp is a main dependency there, so
#                                   this breaks the whole package;
#   drtran >= 0.1.0                 first stable release.
#
# Lowering any of them ships an umbrella that installs and does not work.
#
# art-tseries >= 0.1.12 is the ONE exception to that phrasing, and it is
# deliberately stricter: 0.1.11 installs and works. What 0.1.12 fixes is a
# formal test that ran and answered WRONG — see the comment on the pin.
dependencies = [
    # >=0.1.11 is not housekeeping either. In fue 0.1.10 `FitResult.converged`
    # stopped meaning "ifault == 0" and started requiring that the optimiser
    # stopped on the GRADIENT criterion. art <=0.1.10 raised RuntimeError on
    # `not converged`, so the pair (art 0.1.10, fue 0.1.11) installs cleanly and
    # then aborts every likelihood-ratio test that re-estimates under a
    # restriction -- 18 errors in the RV_M15 bank, on models that stop on the
    # step criterion precisely BECAUSE the restriction leaves them on a ridge.
    # art 0.1.11 distinguishes the two questions; the bound is what keeps the
    # broken combination out.
    #
    # >=0.1.14 desde atsw 1.4.0: es la cota que exige art-tseries 0.2.1 —fue
    # 0.1.13 daba efecto NULO a `compimp` en la previsión (fue/BUG-0014) y 0.1.14
    # arregla un óptimo con media absurda (fue/BUG-0005)—. El paraguas no puede
    # anunciar menos de lo que necesita su propio componente: pip lo resolvería
    # igual por art, pero una cota que miente sobre la suite no se sostiene.
    # >=0.1.16 desde atsw 1.5.0: la que exige art-tseries 0.2.2 (fue/BUG-0023,
    # el conocimiento del modelo que la figura de residuos de art necesita).
    # >=0.1.17 desde atsw 2.0.0: la que exige art-tseries 0.2.3 (los errores
    # estándar por el hessiano en diferencias finitas, fue/BUG-0015; el
    # reinicio del optimizador, BUG-0005; el Jarque-Bera con n/6, BUG-0026).
    # >=0.1.18 desde atsw 2.1.0: la que exigen drvec 0.1.0 y sima-tseries 0.2.0.
    # El componente determinista por UNA rutina de la suite (lib/fuedet, el
    # paso [5] de fue.c), sumado y restado una vez, como lo construye el C de
    # drvec que el porte reproduce (drvec BUG-40).
    "fue>=0.1.18",            # univariate estimation engine + FUF forecasting
    # >=2.0.1 desde atsw 1.5.0: la 2.0.0 rompe con toda serie anual
    # (pyfug/BUG-0002).
    # >=2.0.2 desde atsw 2.0.0: `percent=` y `density=` (pyfug/BUG-0008), que
    # art 0.2.3 usa en sus figuras.
    "pyfug>=2.0.2",           # Jenkins-Treadway graphics
    # >=0.1.12 es de una CLASE DISTINTA a las demás cotas de este fichero, y
    # conviene decirlo en vez de disfrazarlo. Todas las anteriores son «la
    # primera versión que instala y arranca»: por debajo, el paquete no se
    # puede importar o su motor C no carga. art 0.1.11 instala y arranca
    # perfectamente.
    #
    # Lo que arregla 0.1.12 es peor que no arrancar: **arranca y contesta mal**.
    # La nula del contraste de Shin-Fuller no era la de Shin-Fuller (BUG-0065)
    # — no era invariante a cómo se escribiera el AR, así que el mismo modelo
    # daba Φ̂₁ᵤ = 25.746 o 7.632, y un paseo aleatorio puro salía «estacionario».
    # Es el contraste que cierra el ORDEN DE INTEGRACIÓN, del que depende todo
    # lo demás del modelo. Con él, la fecha de una intervención auto-detectada
    # caía un período antes en cualquier modelo diferenciado (BUG-0067) y el
    # polinomio ω(B) se dibujaba con el signo invertido (BUG-0066).
    #
    # Una respuesta equivocada no avisa. Por eso la cota: un entorno que
    # resuelva art 0.1.11 bajo este paraguas correría contrastes que ya sabemos
    # mal calibrados, sin que nada lo indique.
    #
    # >=0.2.1 desde atsw 1.4.0, y por las DOS razones a la vez. art 0.2.0 no
    # funciona en Windows —el analista lo dio por inservible allí—, y donde
    # arranca CONTESTA MAL, que es la clase de la cota de 0.1.12: la Q restaba
    # los deterministas de sus grados de libertad (BUG-0166), Treadway y la
    # alternativa «intervenir» fechaban mal con raíces estacionales (BUG-0172,
    # BUG-0185), un dominio mal escrito daba λ=1 sobre un índice (BUG-0178), y el
    # carril autónomo se paraba en cada estimación (BUG-0181).
    #
    # Y hace falta subirla aunque 0.2.1 ya cumpla `>=0.1.12`: con la cota vieja,
    # quien ya tenga atsw instalado NO recibe la 0.2.1 con `pip install -U atsw`,
    # porque pip no sube una dependencia que ya satisface el mínimo.
    # >=0.2.2 desde atsw 1.5.0: en la 0.2.1 las tres herramientas de previsión
    # fallan en toda instalación limpia (BUG-0191), y la Q del texto tiene un
    # grado de libertad de más por cada factor de frecuencia fija (BUG-0190).
    # >=0.2.3 desde atsw 2.0.0: los contrastes de diferenciación con el AR
    # acotado y el LR comprobado (BUG-0224, 0232, 0235, 0236, 0242, 0243) —la
    # clase de la cota de 0.1.12: contestaban mal—, y el encadenamiento que
    # ignoraba argumentos en silencio (BUG-0245, 0250, 0252).
    "art-tseries>=0.2.3",     # model building + MCP server (art-mcp)
    # >=0.2.0 is NOT housekeeping. Up to 0.1.1 drtran related each series
    # differenced by ITS OWN operator, so whenever the output and the input
    # carried different differencing the fitted transfer was nu(B)*Delta(B) and
    # the reported GAIN was wrong by Delta(1) -- annihilated outright when the
    # excess root sat at frequency zero. An open lower bound would let a stale
    # environment satisfy the suite with the defect live. See drtran BUG-8.
    # >=0.2.5 desde atsw 1.6.0: en la 0.2.4 `mtram` NO ARRANCA en Python 3.10
    # ni 3.11 —sintaxis de f-string que sólo acepta 3.12, y drtran declara
    # >=3.10 (drtran BUG-51)—, y la puerta diagonal medía la muestra común sin
    # las raíces de `ifadf`. Con la cota vieja, quien ya tiene atsw no recibe
    # la 0.2.5 con `pip install -U atsw`.
    # >=0.2.6 desde atsw 2.0.0: la Ljung-Box por serie descuenta lo que
    # descuenta el C (BUG-57), `mtram --help` contesta y sale, y la búsqueda
    # lineal de drvarma 0.2.0 (drvarma BUG-0016), que drtran usa.
    "drtran[mcp]>=0.2.6",     # transfer functions and networks + MCP server (mtram)
    # >=0.1.7 desde atsw 1.6.1: en la 0.1.6 el optimizador —el de drvarma y el
    # de drtran, que usa el mismo `_qnewt`— se colgaba para siempre con un
    # objetivo NaN o infinito (drvarma BUG-0006). Con la cota vieja, quien ya
    # tiene atsw no recibe la 0.1.7 con `pip install -U atsw`.
    #
    # Desde atsw 2.0.0 drvarma NO lleva servidor: el extra `mcp` ya no existe
    # (pip avisaría y lo ignoraría, y `sima` desaparecería). >=0.2.0: el motor
    # de la escalera y de la forma echelon que sima-tseries necesita.
    # >=0.3.0 desde atsw 2.1.0: la que exigen drvec 0.1.0 y sima-tseries 0.2.0.
    # La previsión desde parámetros dados con raíces unitarias
    # (`forecast_given`), que es por donde sima prevé un VEC escrito en niveles
    # —un solo previsor, el del VARMA—, y los autovalores de GSL desde el motor
    # compilado (`gensymmv`, `eigen_nonsymm`), con los que el arranque de
    # Johansen de drvec da los bits de su C en toda plataforma.
    "drvarma>=0.3.0",         # multivariate VARMA engine
    # Nuevo en atsw 2.1.0: el motor del VEC, el porte de drvec. sima-tseries ya
    # lo arrastra, pero va explícito como fue y drvarma: es un motor con su
    # propia rueda binaria (el C de drvec, para los bootstraps), y la lista de
    # dependencias del paraguas es la que dice qué motores trae la suite.
    # >=0.1.0: la primera publicada.
    "drvec>=0.1.0",           # cointegrated VEC engine
    # El asistente sima, su propio paquete. [raw] trae art para la entrada
    # desde la tabla cruda (load_data, characterize, rutas U y V).
    # >=0.2.0 desde atsw 2.1.0: los sistemas cointegrados (el nodo N1c, el
    # rango por bootstrap paramétrico, el VEC y su largo plazo, los trabajos
    # en segundo plano). Con la cota vieja, quien ya tiene atsw no recibe la
    # 0.2.0 con `pip install -U atsw`.
    "sima-tseries[raw]>=0.2.0",  # simultaneous VARMA and VEC + MCP server (sima)
]

# One console script, and deliberately nothing else. The umbrella INSTALLS; it
# does not speak. `atsw-mcp` registers the three assistants with Claude Code in
# one step — MCP has no mechanism for one server to register another, so this is
# a setup command, not a fourth server.
[project.urls]
# atsw no declaraba NINGUNA: su página de PyPI renderizaba el README y no
# llevaba a ningun sitio. El paquete vive en el monorepo de art-python.
Homepage = "https://github.com/davidesg/art-python/tree/master/atsw-suite"
Documentation = "https://github.com/davidesg/art-python/tree/master/docs"
Repository = "https://github.com/davidesg/art-python"
Issues = "https://github.com/davidesg/art-python/issues"
Changelog = "https://github.com/davidesg/art-python/blob/master/CHANGELOG.md"

[project.scripts]
atsw-mcp = "atsw.mcp_install:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["atsw"]
# Los datos de los ejemplos viajan DENTRO del wheel: si sólo fueran en el
# sdist, quien instalase normalmente no podría correr los ejemplos.
package-data = { "atsw" = ["examples/*"] }
