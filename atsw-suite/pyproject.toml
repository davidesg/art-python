[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "atsw"
version         = "1.2.2"
description     = "ATSW — A Time Series Workshop: the Box-Jenkins-Treadway suite (univariate exact-ML estimation, graphics, model building, transfer functions and multivariate VARMA) with three MCP assistants for LLM-driven analysis"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "ARIMA", "VARMA", "multivariate", "Box-Jenkins", "Treadway", "MCP", "suite"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]

# Umbrella meta-package: no code of its own, just a compatible set of the suite
# components. `pip install atsw` installs the whole suite + the MCP server.
# Three MCP assistants, one ladder. They are SEPARATE servers on purpose: an MCP
# client sees every connected server at once, so routing is not a missing
# capability, and merging them would merge three instruction blocks that
# contradict each other at the opening question. This package installs them; it
# deliberately does not speak. See drtran-python/docs/ARCHITECTURE_MCP.md §4b.
#
#     art     one series: ARIMA + interventions        engine: fue      -> art-mcp
#     mtram   transfer functions and networks (a DAG)  engine: drtran   -> mtram
#     sima    simultaneous VARMA                       engine: drvarma  -> sima
# NONE of these lower bounds is cosmetic. Every one of them is the first version
# of its package that actually works in a clean environment:
#
#   fue >= 0.1.9, drvarma >= 0.1.3  every earlier binary wheel installed fine and
#                                   then failed to load its C engine (cffi was
#                                   missing from their runtime dependencies), so
#                                   the suite silently ran on the pure-Python
#                                   fallbacks;
#   art-tseries >= 0.1.4            0.1.3 CANNOT BE IMPORTED at all in a clean
#                                   environment: it declares an unbounded
#                                   `mcp>=1.0`, and mcp 2.0.0 removed
#                                   `mcp.server.fastmcp`, which art/mcp_server.py
#                                   imports. mcp is a main dependency there, so
#                                   this breaks the whole package;
#   drtran >= 0.1.0                 first stable release.
#
# Lowering any of them ships an umbrella that installs and does not work.
dependencies = [
    "fue>=0.1.9",             # univariate estimation engine + FUF forecasting
    "pyfug>=2.0",             # Jenkins-Treadway graphics
    "art-tseries>=0.1.6",     # model building + MCP server (art-mcp)
    # >=0.2.0 is NOT housekeeping. Up to 0.1.1 drtran related each series
    # differenced by ITS OWN operator, so whenever the output and the input
    # carried different differencing the fitted transfer was nu(B)*Delta(B) and
    # the reported GAIN was wrong by Delta(1) -- annihilated outright when the
    # excess root sat at frequency zero. An open lower bound would let a stale
    # environment satisfy the suite with the defect live. See drtran BUG-8.
    "drtran[mcp]>=0.2.0",     # transfer functions and networks + MCP server (mtram)
    "drvarma[mcp]>=0.1.3",    # multivariate VARMA + MCP server (sima)
]

# One console script, and deliberately nothing else. The umbrella INSTALLS; it
# does not speak. `atsw-mcp` registers the three assistants with Claude Code in
# one step — MCP has no mechanism for one server to register another, so this is
# a setup command, not a fourth server.
[project.urls]
# atsw no declaraba NINGUNA: su página de PyPI renderizaba el README y no
# llevaba a ningun sitio. El paquete vive en el monorepo de art-python.
Homepage = "https://github.com/davidesg/art-python/tree/master/atsw-suite"
Documentation = "https://github.com/davidesg/art-python/tree/master/docs"
Repository = "https://github.com/davidesg/art-python"
Issues = "https://github.com/davidesg/art-python/issues"
Changelog = "https://github.com/davidesg/art-python/blob/master/CHANGELOG.md"

[project.scripts]
atsw-mcp = "atsw.mcp_install:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["atsw"]
# Los datos de los ejemplos viajan DENTRO del wheel: si sólo fueran en el
# sdist, quien instalase normalmente no podría correr los ejemplos.
package-data = { "atsw" = ["examples/*"] }
