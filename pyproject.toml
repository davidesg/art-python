[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "art-tseries"
version         = "0.2.2"
description     = "ART — A Real-Time Time-Series Analysis toolkit (Box-Jenkins-Treadway methodology) + MCP server (uses fue and pyfug)"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "real-time", "ARIMA", "Box-Jenkins", "Treadway", "MCP", "forecasting"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # >=0.1.9: earlier fue wheels installed but could not load their C engine
    # (cffi was missing from its runtime dependencies), so the estimator
    # silently degraded to pure Python.
    # >=0.1.10: `FitResult.converged` cambia de significado en esa versión —deja
    # de ser «ifault == 0» y exige además que el optimizador haya parado por el
    # criterio del gradiente—, y art distingue ahora las dos cosas
    # (formal_tests._fit_py). Con fue 0.1.9 el aviso nuevo no existe; con
    # 0.1.10 y el art anterior, los contrastes que reestiman con restricción
    # lanzaban RuntimeError.
    # >=0.1.14: dos defectos de fue que art vigila desde sus propias pruebas y
    # que con una versión anterior las hacen fallar —correctamente, porque el
    # defecto está ahí—:
    #   · 0.1.13 (fue/BUG-0014) la previsión daba efecto NULO a `compimp`,
    #     `easter` y `trend`: tres de los once tipos deterministas. `compimp` lo
    #     produce el nodo de intervenciones de art, así que el alcance es amplio.
    #   · 0.1.14 (fue/BUG-0005) un óptimo con una media absurda dejaba de
    #     reportarse como `converged=True` sin aviso.
    # [report]: el extra que trae jinja2. generate_forecast, update_and_forecast
    # y sps_dashboard escriben su informe con fue.write_forecast_report, que lo
    # necesita; sin él, las tres herramientas fallaban en TODA instalación
    # limpia —la 0.2.1 publicada incluida— y nadie lo veía porque en los
    # entornos de desarrollo jinja2 estaba por otra vía (BUG-0191).
    # >=0.1.16: art llama a fue.diagnostics.free_arma_count, default_lags,
    # differencing_offset y residuals_start (fue/BUG-0023), el conocimiento del
    # modelo que la figura de residuos necesita (BUG-0165, BUG-0190). Con la
    # 0.1.14 art no importa esas funciones: falla, no degrada. Y trae el
    # contrato de ficheros de fue/BUG-0017…0022, que art/BUG-0187…0189 supone.
    "fue[report]>=0.1.16",
    # >=2.0.1: la 2.0.0 lanza UnboundLocalError en `plot_combined` con TODA
    # serie anual (pyfug/BUG-0002), que es la figura de identificación y la de
    # residuos de art: con una serie anual, art se quedaba sin figuras.
    "pyfug>=2.0.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    # pandas: load_data, preview_data y create_inp leen Excel y CSV con él. Y
    # openpyxl es el motor que pandas usa para `.xlsx`, cargado en tiempo de
    # ejecución (ningún import lo nombra). Los dos llegaban de REBOTE, como
    # dependencias de pyfug: si pyfug los suelta, la entrada de datos de art se
    # rompe sin que nada en art haya cambiado (BUG-0191).
    "pandas>=2.0",
    "openpyxl>=3.1",
    # mcp<2 is NOT conservatism: mcp 2.0.0 REMOVED `mcp.server.fastmcp`, which
    # is what `art/mcp_server.py:18` imports. An unbounded `mcp>=1.0` resolves
    # to 2.x on any fresh install, and `art-mcp` then dies on import. Verified:
    # 1.27.2 and 1.29.0 work, 2.0.0 raises ModuleNotFoundError. Published
    # 0.1.3 carries the unbounded pin and is broken in a clean environment.
    # Lift the cap only after porting the import.
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev  = ["pytest>=7"]

[project.urls]
# No había NINGUNA: la página de PyPI no llevaba a ningún sitio. `Documentation`
# es además el campo que PyPI muestra más arriba.
Homepage = "https://github.com/davidesg/art-python"
Documentation = "https://github.com/davidesg/art-python/tree/master/docs"
Repository = "https://github.com/davidesg/art-python"
Issues = "https://github.com/davidesg/art-python/issues"
Changelog = "https://github.com/davidesg/art-python/blob/master/CHANGELOG.md"

[project.scripts]
art-mcp = "art.mcp_server:main"
art-bug = "art.bug_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# BUG-0125: el material que los recursos MCP sirven en ejecución. Va DENTRO del
# paquete porque un recurso se pide en una sesión instalada, no en el árbol de
# trabajo; `tools/sync_material.py` lo genera desde `bugs/` y `docs/`, que
# siguen siendo el único original. Sin esto la rueda salía con 27 ficheros y
# `art://defectos` contestaba que no había nada.
[tool.setuptools.package-data]
art = ["material/bugs/*.md", "material/docs/*.md"]

[tool.pytest.ini_options]
# ORDEN 0.1. `slow` marca lo que arranca un proceso y cruza la frontera MCP:
# es lento por naturaleza —importa el paquete entero en otro intérprete— y es
# lo único que ve los defectos que sólo existen al cruzarla.
#     pytest -m "not slow"    la suite de siempre
#     pytest -m slow          sólo la frontera
markers = [
    "slow: arranca el servidor MCP en un subproceso y habla con él por stdio",
]
